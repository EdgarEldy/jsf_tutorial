<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/layout.xhtml">
    <f:metadata>
        <f:viewParam name="productId" value="#{orderBean.productId}"/>
        <f:viewAction action="#{orderBean.loadProduct}"/>
    </f:metadata>

    <ui:define name="title">Place order</ui:define>
    <ui:define name="content">
        <h2>Place order</h2>
        <h:panelGroup rendered="#{orderBean.product == null}">
            <p>Product not found.</p>
        </h:panelGroup>
        <h:form id="form" rendered="#{orderBean.product != null}">
            <p:messages showDetail="true" closable="true"/>

            <p><h:outputText value="#{orderBean.product.productName}"/> -
                <h:outputText value="#{orderBean.product.unitPrice}"/> each</p>

            <p:outputLabel for="quantity" value="Quantity"/>
            <p:inputNumber id="quantity" value="#{orderBean.quantity}" decimalPlaces="0" required="true"/>

            <p:commandButton value="Place order" action="#{orderBean.placeOrder}"/>
        </h:form>
    </ui:define>
</ui:composition>
