<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/auth-layout.xhtml">
    <ui:define name="title">Reset password</ui:define>
    <ui:define name="content">
        <h2>Reset your password</h2>
        <h:form prependId="false">
            <p:messages showDetail="true" closable="true"/>

            <p:outputLabel for="newPassword" value="New password"/>
            <p:password id="newPassword" value="#{resetPasswordBean.newPassword}" required="true" feedback="true"/>

            <p:outputLabel for="confirmPassword" value="Confirm password"/>
            <p:password id="confirmPassword" value="#{resetPasswordBean.confirmPassword}" required="true" feedback="false"/>

            <p:commandButton value="Reset password" action="#{resetPasswordBean.submit}"/>
        </h:form>
    </ui:define>
</ui:composition>
