<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/auth-layout.xhtml">
    <ui:define name="title">Register</ui:define>
    <ui:define name="content">
        <h2>Register</h2>
        <h:form prependId="false">
            <p:messages showDetail="true" closable="true"/>

            <p:outputLabel for="firstName" value="First name"/>
            <p:inputText id="firstName" value="#{registerBean.firstName}" required="true"/>

            <p:outputLabel for="lastName" value="Last name"/>
            <p:inputText id="lastName" value="#{registerBean.lastName}" required="true"/>

            <p:outputLabel for="email" value="Email"/>
            <p:inputText id="email" value="#{registerBean.email}" required="true"/>

            <p:outputLabel for="password" value="Password"/>
            <p:password id="password" value="#{registerBean.password}" required="true" feedback="true"/>

            <p:commandButton value="Register" action="#{registerBean.register}"/>
        </h:form>
    </ui:define>
</ui:composition>
