<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/auth-layout.xhtml">
    <ui:define name="title">Forgot password</ui:define>
    <ui:define name="content">
        <h2>Forgot your password?</h2>
        <h:form prependId="false">
            <p:messages showDetail="true" closable="true"/>

            <p:outputLabel for="email" value="Email"/>
            <p:inputText id="email" value="#{forgotPasswordBean.email}" required="true"/>

            <p:commandButton value="Send reset link" action="#{forgotPasswordBean.submit}"/>
        </h:form>
    </ui:define>
</ui:composition>
