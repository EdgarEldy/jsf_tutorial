name: CI

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
    branches: [master, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jsf_tutorial_db
          MYSQL_USER: jsf_tutorial
          MYSQL_PASSWORD: jsf_tutorial
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ujsf_tutorial -pjsf_tutorial"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: mvn verify (unit + Arquillian integration tests)
        run: mvn -B verify
